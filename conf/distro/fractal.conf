DISTRO = "fractal"
DISTRO_NAME = "FractalCR"
DISTRO_VERSION = "0.5"
# Wrynose appends DISTRO_FEATURES_DEFAULTS even when DISTRO_FEATURES is set.
# This appliance opts into its features explicitly; no desktop or ptest suite.
DISTRO_FEATURES_DEFAULTS = ""
DISTRO_FEATURES = "acl ipv4 ipv6 largefile ldconfig seccomp virtualization xattr"
DISTRO_FEATURES_OPTED_OUT = "pulseaudio sysvinit systemd"
TCLIBC = "glibc"
GLIBC_GENERATE_LOCALES = "en_US.UTF-8"
INIT_MANAGER = "fractal"
PACKAGE_CLASSES = "package_ipk"
NO_RECOMMENDATIONS = "1"
PREFERRED_PROVIDER_virtual/docker = "docker-moby"
PREFERRED_PROVIDER_virtual/containerd = "containerd"
PREFERRED_PROVIDER_virtual/runc = "runc"
VIRTUAL-RUNTIME_container_runtime = "runc"
INHERIT_DISTRO:remove = "create-spdx"
